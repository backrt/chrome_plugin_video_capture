<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Recorder store asset renderer</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1016; color: #f8fafc; }
      .asset { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at 12% 12%, #3b1620 0, transparent 34%), radial-gradient(circle at 90% 82%, #142a48 0, transparent 38%), #0b1016; }
      .noise { position: absolute; inset: 0; opacity: .18; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 36px 36px; }
      .mark { position: relative; flex: none; border-radius: 24%; background: linear-gradient(145deg, #ff3030, #d90e16); box-shadow: 0 18px 55px rgba(239, 27, 27, .3); }
      .mark::after { content: ""; position: absolute; inset: 27%; border-radius: 50%; background: #fff; }
      .logo-only { display: grid; place-items: center; background: transparent; }
      .logo-only .mark { width: 100%; height: 100%; border-radius: 22%; box-shadow: none; }
      .promo { display: flex; align-items: center; justify-content: center; gap: 8%; padding: 8%; }
      .promo .mark { width: 30%; aspect-ratio: 1; }
      .promo-copy { display: flex; flex-direction: column; gap: .28em; }
      .promo-kicker { display: flex; align-items: center; gap: .45em; color: #fca5a5; font-weight: 700; letter-spacing: .2em; }
      .rec-dot { width: .72em; height: .72em; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 .28em rgba(239,68,68,.16); }
      .promo-title { font-weight: 760; letter-spacing: -.04em; line-height: .95; }
      .promo-line { width: 76%; height: .15em; border-radius: 10em; background: linear-gradient(90deg, #ef4444 0 64%, #334155 64%); margin-top: .35em; }
      .promo.small .promo-title { font-size: 2.5em; }
      .promo.small .promo-kicker { font-size: .72em; }
      .promo.large { justify-content: space-between; padding: 6% 11%; }
      .promo.large .mark { width: 25%; }
      .promo.large .promo-title { font-size: 5.8em; }
      .promo.large .promo-kicker { font-size: 1.45em; }
      .showcase { padding: 54px 64px; }
      .brand { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 720; }
      .brand .mark { width: 42px; height: 42px; border-radius: 11px; box-shadow: none; }
      .headline { position: relative; z-index: 2; margin-top: 42px; width: 590px; }
      .headline h1 { margin: 0; font-size: 52px; line-height: 1.08; letter-spacing: -.04em; }
      .headline p { margin: 18px 0 0; width: 530px; color: #aebac8; font-size: 20px; line-height: 1.55; }
      .browser-window { position: absolute; left: 64px; right: 64px; bottom: 48px; height: 390px; border: 1px solid #334155; border-radius: 22px; overflow: hidden; background: #151c25; box-shadow: 0 30px 100px rgba(0,0,0,.45); }
      .browser-bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #293442; background: #111821; }
      .browser-bar i { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
      .address { margin-left: 10px; width: 54%; height: 22px; border-radius: 8px; background: #202b37; }
      .video-stage { position: absolute; inset: 42px 0 0; background: radial-gradient(circle at 40% 42%, #374151, #17202b 56%, #0d131a); }
      .video-shape { position: absolute; left: 8%; top: 14%; width: 58%; height: 64%; border-radius: 16px; background: linear-gradient(135deg, #263648, #151d28); border: 1px solid #3d4b5b; overflow: hidden; }
      .video-shape::before { content: ""; position: absolute; width: 230px; height: 230px; border-radius: 50%; left: 22%; top: -28%; background: rgba(239,68,68,.14); }
      .video-shape::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 10%; height: 5px; border-radius: 8px; background: linear-gradient(90deg, #ef4444 0 48%, #64748b 48%); }
      .play-symbol { position: absolute; left: 35%; top: 35%; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.9); }
      .play-symbol::after { content: ""; position: absolute; left: 30px; top: 22px; border-left: 22px solid #ef1b1b; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
      .popup { position: absolute; z-index: 5; right: 94px; bottom: 72px; width: 320px; border: 1px solid #344151; border-radius: 18px; background: #171d24; box-shadow: 0 28px 80px rgba(0,0,0,.58); padding: 16px; }
      .popup-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 680; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
      .status-dot.recording { background: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.18); }
      .status-dot.saved { background: #22c55e; }
      .status { margin-top: 4px; color: #9aa6b2; font-size: 13px; }
      .timer { margin-top: 12px; padding: 12px 0 16px; border-top: 1px solid #2a3440; border-bottom: 1px solid #2a3440; text-align: center; font-size: 32px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
      .button { margin-top: 14px; width: 100%; border-radius: 10px; padding: 10px 12px; text-align: center; color: white; background: #dc2626; font-size: 14px; font-weight: 650; }
      .button.stop { background: #2563eb; }
      .folder { margin-top: 8px; border: 1px solid #2a3440; border-radius: 10px; padding: 9px; text-align: center; font-size: 13px; }
      .result { margin-top: 10px; padding: 8px 10px; border: 1px solid #1f6b39; border-radius: 8px; color: #bbf7d0; background: #12351f; font-size: 12px; }
      .legal { margin-top: 12px; padding: 9px 10px; border: 1px solid #3a2f1d; border-radius: 10px; color: #d6c7a1; background: #1c1812; font-size: 11px; line-height: 1.45; }
      .legal strong { display: block; margin-bottom: 4px; color: #fbbf24; }
      .state-saved .video-shape::after { background: #22c55e; }
      .state-saved .play-symbol::after { border-left-color: #16a34a; }
    </style>
  </head>
  <body>
    <div id="root" class="asset"></div>
    <script>
      const copy = {
        "zh-CN": {
          name: "视频录制机", idleTitle: "只录制你实际播放的内容", idleSub: "一键开始，本地保存，不上传录制数据",
          recordingTitle: "播放到哪里，录制到哪里", recordingSub: "暂停、缓冲和继续播放都会同步跟随",
          savedTitle: "生成可拖动的 WebM 文件", savedSub: "本地生成时长与索引，保存后即可定位播放",
          idle: "未录制", recording: "录制中", saved: "保存完成", start: "开始录制", stop: "停止并保存", folder: "打开下载目录",
          legalTitle: "使用须知", legal: "只录制你有权保存的内容；不下载原始片源，也不能绕过 DRM。", result: "保存成功：已生成 1 个可拖动视频文件"
        },
        "zh-TW": {
          name: "影片錄製機", idleTitle: "只錄製您實際播放的內容", idleSub: "一鍵開始、本機儲存，不上傳錄製資料",
          recordingTitle: "播放到哪裡，錄製到哪裡", recordingSub: "暫停、緩衝與繼續播放都會同步跟隨",
          savedTitle: "建立可拖曳定位的 WebM", savedSub: "在本機建立時長與索引，儲存後即可定位播放",
          idle: "未錄製", recording: "錄製中", saved: "儲存完成", start: "開始錄製", stop: "停止並儲存", folder: "開啟下載資料夾",
          legalTitle: "使用須知", legal: "只錄製您有權儲存的內容；不下載原始片源，也不能繞過 DRM。", result: "儲存成功：已建立 1 個可拖曳定位的影片檔案"
        },
        "en-US": {
          name: "Video Recorder", idleTitle: "Record only what you actually play", idleSub: "Start in one click, save locally, and upload nothing",
          recordingTitle: "Recording follows playback", recordingSub: "Pauses, buffering, and resumed playback stay in sync",
          savedTitle: "Create a seekable WebM file", savedSub: "Duration and seek indexes are finalized locally before saving",
          idle: "Not recording", recording: "Recording", saved: "Saved", start: "Start recording", stop: "Stop and save", folder: "Open downloads folder",
          legalTitle: "Usage notice", legal: "Record only content you have the right to save. No original-media downloads or DRM bypass.", result: "Saved: created 1 seekable video file"
        },
        "ja-JP": {
          name: "ビデオレコーダー", idleTitle: "実際に再生した範囲だけを録画", idleSub: "ワンクリックで開始し、データを送信せずローカル保存",
          recordingTitle: "再生に合わせて録画", recordingSub: "一時停止、バッファリング、再開にも同期します",
          savedTitle: "シーク可能な WebM を作成", savedSub: "再生時間とインデックスをローカルで処理して保存",
          idle: "未録画", recording: "録画中", saved: "保存完了", start: "録画を開始", stop: "停止して保存", folder: "ダウンロードフォルダーを開く",
          legalTitle: "使用上の注意", legal: "保存する権利のあるコンテンツにのみ使用してください。元メディアの取得や DRM 回避は行いません。", result: "保存完了：シーク可能な動画ファイルを 1 件作成しました"
        },
        "ko-KR": {
          name: "비디오 녹화기", idleTitle: "실제로 재생한 내용만 녹화", idleSub: "한 번의 클릭으로 시작하고 업로드 없이 로컬 저장",
          recordingTitle: "재생 상태를 그대로 따라가는 녹화", recordingSub: "일시 정지, 버퍼링 및 재생 재개와 동기화됩니다",
          savedTitle: "탐색 가능한 WebM 파일 생성", savedSub: "재생 시간과 탐색 인덱스를 로컬에서 처리한 후 저장",
          idle: "녹화 안 함", recording: "녹화 중", saved: "저장 완료", start: "녹화 시작", stop: "중지하고 저장", folder: "다운로드 폴더 열기",
          legalTitle: "사용 안내", legal: "저장 권한이 있는 콘텐츠만 녹화하세요. 원본 미디어 다운로드 또는 DRM 우회를 하지 않습니다.", result: "저장 완료: 탐색 가능한 동영상 파일 1개를 만들었습니다"
        }
      };

      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") || "screenshot";
      const locale = params.get("locale") || "en-US";
      const state = params.get("state") || "idle";
      const t = copy[locale] || copy["en-US"];
      document.documentElement.lang = locale;
      document.title = `${kind}-${locale}-${state}`;

      function mark() { return '<span class="mark" aria-hidden="true"></span>'; }
      function promo(size) {
        return `<div class="asset promo ${size}"><div class="noise"></div>${mark()}<div class="promo-copy"><div class="promo-kicker"><span class="rec-dot"></span>REC · WEBM</div><div class="promo-title">VIDEO<br>RECORDER</div><div class="promo-line"></div></div></div>`;
      }
      function popup() {
        const isRecording = state === "recording";
        const isSaved = state === "saved";
        return `<section class="popup state-${state}">
          <div class="popup-title"><span class="status-dot ${state}"></span>${t.name}</div>
          <div class="status">${isRecording ? t.recording : isSaved ? t.saved : t.idle}</div>
          <div class="timer">${isRecording ? "01:24" : isSaved ? "02:18" : "00:00"}</div>
          <div class="button ${isRecording ? "stop" : ""}">${isRecording ? t.stop : t.start}</div>
          <div class="folder">${t.folder}</div>
          ${isSaved ? `<div class="result">${t.result}</div>` : ""}
          <div class="legal"><strong>${t.legalTitle}</strong>${t.legal}</div>
        </section>`;
      }
      function screenshot() {
        const title = state === "recording" ? t.recordingTitle : state === "saved" ? t.savedTitle : t.idleTitle;
        const sub = state === "recording" ? t.recordingSub : state === "saved" ? t.savedSub : t.idleSub;
        return `<div class="asset showcase state-${state}"><div class="noise"></div>
          <div class="brand">${mark()}<span>${t.name}</span></div>
          <div class="headline"><h1>${title}</h1><p>${sub}</p></div>
          <div class="browser-window"><div class="browser-bar"><i></i><i></i><i></i><div class="address"></div></div><div class="video-stage"><div class="video-shape"><span class="play-symbol"></span></div></div></div>
          ${popup()}
        </div>`;
      }

      const root = document.getElementById("root");
      if (kind === "logo") root.outerHTML = `<div class="asset logo-only" style="background:#fff">${mark()}</div>`;
      else if (kind === "small") root.outerHTML = promo("small");
      else if (kind === "large") root.outerHTML = promo("large");
      else root.outerHTML = screenshot();
    </script>
  </body>
</html>
