<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Recorder Firefox assets</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#100b20;color:#fff}.asset{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 10% 4%,#382067 0,transparent 33%),radial-gradient(circle at 88% 88%,#3d1728 0,transparent 39%),#100b20}.grid{position:absolute;inset:0;opacity:.15;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:40px 40px}.mark{position:relative;display:inline-block;flex:none;border-radius:23%;background:linear-gradient(145deg,#ff3947,#d50b1d);box-shadow:0 16px 48px #ef233c44}.mark:after{content:"";position:absolute;inset:28%;border-radius:50%;background:#fff}.logo{display:grid;place-items:center;background:#fff}.logo .mark{width:100%;height:100%;box-shadow:none}.showcase{padding:52px 64px}.brand{position:relative;z-index:2;display:flex;align-items:center;gap:13px;font-size:20px;font-weight:750}.brand .mark{width:42px;height:42px;border-radius:11px;box-shadow:none}.eyebrow{margin-top:40px;color:#c4a7ff;font-weight:700;letter-spacing:.16em;font-size:13px}.headline{position:relative;z-index:2;width:610px}.headline h1{margin:10px 0 0;font-size:50px;line-height:1.08;letter-spacing:-.04em}.headline p{margin:16px 0 0;width:550px;color:#b8b1c8;font-size:20px;line-height:1.5}.window{position:absolute;left:64px;right:64px;bottom:46px;height:390px;border:1px solid #51436d;border-radius:22px;overflow:hidden;background:#181329;box-shadow:0 30px 100px #0009}.bar{height:42px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #3b3152;background:#151022}.bar i{width:9px;height:9px;border-radius:50%;background:#6c5d87}.address{margin-left:10px;width:54%;height:22px;border-radius:8px;background:#29213c}.stage{position:absolute;inset:42px 0 0;background:radial-gradient(circle at 38% 40%,#433c58,#201a31 58%,#120e1d)}.video{position:absolute;left:8%;top:14%;width:58%;height:64%;border-radius:16px;background:linear-gradient(135deg,#3c3152,#1b1628);border:1px solid #5d4d78;overflow:hidden}.video:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;left:19%;top:-35%;background:#ff394722}.video:after{content:"";position:absolute;left:8%;right:8%;bottom:10%;height:5px;border-radius:8px;background:linear-gradient(90deg,#ff3947 0 48%,#776a8f 48%)}.play{position:absolute;left:35%;top:35%;width:72px;height:72px;border-radius:50%;background:#fffffff0}.play:after{content:"";position:absolute;left:30px;top:22px;border-left:22px solid #e71932;border-top:14px solid transparent;border-bottom:14px solid transparent}.popup{position:absolute;z-index:5;right:94px;bottom:70px;width:320px;border:1px solid #524569;border-radius:18px;background:#1b1725;box-shadow:0 28px 80px #000a;padding:16px}.popup-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#746d80}.dot.recording{background:#ff3947;box-shadow:0 0 0 4px #ff394733}.dot.saved{background:#36d27b}.status{margin-top:4px;color:#aaa2b6;font-size:13px}.timer{margin-top:12px;padding:12px 0 16px;border-top:1px solid #373142;border-bottom:1px solid #373142;text-align:center;font-size:32px;letter-spacing:.04em;font-variant-numeric:tabular-nums}.button{margin-top:14px;width:100%;border-radius:10px;padding:10px 12px;text-align:center;color:#fff;background:#dc2338;font-size:14px;font-weight:650}.button.stop{background:#6d4bd1}.folder{margin-top:8px;border:1px solid #3b3448;border-radius:10px;padding:9px;text-align:center;font-size:13px}.result{margin-top:10px;padding:8px 10px;border:1px solid #26794a;border-radius:8px;color:#c5f8d9;background:#123520;font-size:12px}.legal{margin-top:12px;padding:9px 10px;border:1px solid #51432a;border-radius:10px;color:#d8c9a6;background:#211b13;font-size:11px;line-height:1.45}.legal strong{display:block;margin-bottom:4px;color:#ffc54d}.saved-state .video:after{background:#36d27b}.saved-state .play:after{border-left-color:#24ae62}
  </style>
</head>
<body><div id="root" class="asset"></div><script>
const copy={
"zh-CN":{name:"视频录制机",idleTitle:"只录制你实际播放的内容",idleSub:"在 Firefox 中一键开始，本地保存，不上传录制数据",recordingTitle:"播放到哪里，录制到哪里",recordingSub:"暂停、缓冲和继续播放都会同步跟随",savedTitle:"生成可拖动的 WebM 文件",savedSub:"本地生成时长与索引，保存后即可定位播放",idle:"未录制",recording:"录制中",saved:"保存完成",start:"开始录制",stop:"停止并保存",folder:"打开下载目录",notice:"使用须知",legal:"只录制你有权保存的内容；不下载原始片源，也不能绕过 DRM。",result:"保存成功：已生成 1 个可拖动视频文件"},
"zh-TW":{name:"影片錄製機",idleTitle:"只錄製您實際播放的內容",idleSub:"在 Firefox 中一鍵開始、本機儲存，不上傳錄製資料",recordingTitle:"播放到哪裡，錄製到哪裡",recordingSub:"暫停、緩衝與繼續播放都會同步跟隨",savedTitle:"建立可拖曳定位的 WebM",savedSub:"在本機建立時長與索引，儲存後即可定位播放",idle:"未錄製",recording:"錄製中",saved:"儲存完成",start:"開始錄製",stop:"停止並儲存",folder:"開啟下載資料夾",notice:"使用須知",legal:"只錄製您有權儲存的內容；不下載原始片源，也不能繞過 DRM。",result:"儲存成功：已建立 1 個可拖曳定位的影片檔案"},
"en-US":{name:"Video Recorder",idleTitle:"Record only what you actually play",idleSub:"Start in Firefox, save locally, and upload nothing",recordingTitle:"Recording follows playback",recordingSub:"Pauses, buffering, and resumed playback stay in sync",savedTitle:"Create a seekable WebM file",savedSub:"Duration and seek indexes are finalized locally before saving",idle:"Not recording",recording:"Recording",saved:"Saved",start:"Start recording",stop:"Stop and save",folder:"Open downloads folder",notice:"Usage notice",legal:"Record only content you may save. No original-media downloads or DRM bypass.",result:"Saved: created 1 seekable video file"},
"ja-JP":{name:"ビデオレコーダー",idleTitle:"実際に再生した範囲だけを録画",idleSub:"Firefox で開始し、データを送信せずローカル保存",recordingTitle:"再生に合わせて録画",recordingSub:"一時停止、バッファリング、再開にも同期します",savedTitle:"シーク可能な WebM を作成",savedSub:"再生時間とインデックスをローカルで処理して保存",idle:"未録画",recording:"録画中",saved:"保存完了",start:"録画を開始",stop:"停止して保存",folder:"ダウンロードフォルダーを開く",notice:"使用上の注意",legal:"保存する権利のあるコンテンツにのみ使用してください。元メディアの取得や DRM 回避は行いません。",result:"保存完了：シーク可能な動画ファイルを 1 件作成しました"},
"ko-KR":{name:"비디오 녹화기",idleTitle:"실제로 재생한 내용만 녹화",idleSub:"Firefox에서 시작하고 업로드 없이 로컬 저장",recordingTitle:"재생 상태를 그대로 따라가는 녹화",recordingSub:"일시 정지, 버퍼링 및 재생 재개와 동기화됩니다",savedTitle:"탐색 가능한 WebM 파일 생성",savedSub:"재생 시간과 탐색 인덱스를 로컬에서 처리한 후 저장",idle:"녹화 안 함",recording:"녹화 중",saved:"저장 완료",start:"녹화 시작",stop:"중지하고 저장",folder:"다운로드 폴더 열기",notice:"사용 안내",legal:"저장 권한이 있는 콘텐츠만 녹화하세요. 원본 미디어 다운로드 또는 DRM 우회를 하지 않습니다.",result:"저장 완료: 탐색 가능한 동영상 파일 1개를 만들었습니다"}};
const q=new URLSearchParams(location.search),kind=q.get("kind")||"screenshot",locale=q.get("locale")||"en-US",state=q.get("state")||"idle",t=copy[locale]||copy["en-US"];document.documentElement.lang=locale;document.title=`${kind}-${locale}-${state}`;
const mark=()=>'<span class="mark" aria-hidden="true"></span>';
function panel(){const rec=state==="recording",saved=state==="saved";return `<section class="popup"><div class="popup-title"><span class="dot ${state}"></span>${t.name}</div><div class="status">${rec?t.recording:saved?t.saved:t.idle}</div><div class="timer">${rec?"01:24":saved?"02:18":"00:00"}</div><div class="button ${rec?"stop":""}">${rec?t.stop:t.start}</div><div class="folder">${t.folder}</div>${saved?`<div class="result">${t.result}</div>`:""}<div class="legal"><strong>${t.notice}</strong>${t.legal}</div></section>`}
function shot(){const title=state==="recording"?t.recordingTitle:state==="saved"?t.savedTitle:t.idleTitle,sub=state==="recording"?t.recordingSub:state==="saved"?t.savedSub:t.idleSub;return `<div class="asset showcase ${state==="saved"?"saved-state":""}"><div class="grid"></div><div class="brand">${mark()}<span>${t.name}</span></div><div class="eyebrow">FIREFOX · LOCAL RECORDING</div><div class="headline"><h1>${title}</h1><p>${sub}</p></div><div class="window"><div class="bar"><i></i><i></i><i></i><div class="address"></div></div><div class="stage"><div class="video"><span class="play"></span></div></div></div>${panel()}</div>`}
document.getElementById("root").outerHTML=kind==="logo"?`<div class="asset logo">${mark()}</div>`:shot();
</script></body></html>
